name: ci

on:
  push:
    branches: [ "main", "rsmpeg", "dev" ]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ "main", "rsmpeg", "dev" ]
    paths-ignore:
      - 'README.md'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_LOG: "debug"
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:

  build-linux:
    name: build / ${{ matrix.platform }} / ffmpeg-${{ matrix.ffmpeg_version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: ["linux/amd64"]
        ffmpeg_version: ["6.1", "7.1", "8.0"]
        include:
          - ffmpeg_version: "6.1"
            lib_subdir: "amd64"
            file: "ffmpeg-6.1-linux-clang-default.tar.xz"
            feature: "ndarray,ffmpeg6,link_system_ffmpeg"
          - ffmpeg_version: "7.1"
            lib_subdir: "amd64"
            file: "ffmpeg-7.1-linux-clang-default.tar.xz"
            feature: "ndarray,ffmpeg7,link_system_ffmpeg"
          - ffmpeg_version: "8.0"
            lib_subdir: "amd64"
            file: "ffmpeg-8.0-linux-clang-default.tar.xz"
            feature: "ndarray,ffmpeg8,link_system_ffmpeg"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
          nasm \
          yasm \
          curl \
          wget \
          unzip \
          gnupg \
          clang \
          cmake \
          libtool \
          autoconf \
          automake \
          binutils \
          pkg-config \
          llvm-dev \
          libc++1 \
          libva2 \
          libva-drm2 \
          libva-x11-2 \
          libvdpau1 \
          libxv1 \
          libclang-dev \
          linux-libc-dev \
          build-essential \
          ca-certificates \
          libva-dev \
          libvpx-dev \
          libaom-dev \
          libass-dev \
          libdrm-dev \
          libv4l-dev \
          libx264-dev \
          libx264-164 \
          libx265-dev \
          libx265-199 \
          libzimg-dev \
          libdav1d-dev \
          libwebp-dev \
          libbluray-dev \
          libtheora-dev \
          libvidstab-dev \
          libsvtav1-dev \
          libxvidcore-dev \
          libopenjp2-7-dev \
          libgsm1-dev \
          libsoxr-dev \
          libopus-dev \
          libpulse-dev \
          libshine-dev \
          libspeex-dev \
          libbs2b-dev \
          libvorbis-dev \
          libfdk-aac-dev \
          libasound2-dev \
          libmp3lame-dev \
          libmp3lame0 \
          libtwolame-dev \
          libjack-jackd2-dev \
          libopencore-amrnb-dev \
          libopencore-amrwb-dev \
          libva-dev \
          libmfx-dev \
          libdrm-dev \
          libnuma-dev \
          libvdpau-dev \
          ocl-icd-opencl-dev \
          libass-dev \
          libxml2-dev \
          libfribidi-dev \
          libfreetype6-dev \
          libfontconfig1-dev \
          libssh-dev \
          libzmq3-dev \
          libssl-dev \
          librtmp-dev \
          libiec61883-dev \
          libgnutls28-dev \
          libsmbclient-dev \
          libtiff-dev \
          libpng-dev \
          libraw-dev \
          libjpeg-dev \
          zlib1g-dev \
          libsdl2-dev \
          liblzma-dev \
          libzvbi-dev \
          libpostproc-dev \
          librubberband-dev \
          libfrei0r-ocaml-dev
## ffmpeg
## libavutil-dev \
## libavcodec-dev \
## libavformat-dev \
## libavfilter-dev \
## libavdevice-dev \
## libswscale-dev \
## libswresample-dev \

      - name: Download FFmpeg-${{ matrix.ffmpeg_version }}
        shell: bash
        run: |
          mkdir ffmpeg_home
          curl -L "https://sourceforge.net/projects/avbuild/files/linux/${{ matrix.file }}/download" \
          | tar xJf - --strip 1 -C ffmpeg_home
          
          echo "FFMPEG_INCLUDE_DIR=$PWD/ffmpeg_home/include" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$PWD/ffmpeg_home/lib/${{ matrix.lib_subdir }}/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/ffmpeg_home/lib/${{ matrix.lib_subdir }}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt, clippy, rust-src, llvm-tools-preview, rust-analysis

      - name: Clippy check
        run: cargo clippy --no-default-features --features ${{ matrix.feature }} -- -D warnings

      - name: Build
        run: cargo build --no-default-features --features ${{ matrix.feature }} --verbose

      - name: Run Test
        run: cargo test --all --no-default-features --features ${{ matrix.feature }} --verbose -- --nocapture

  build-macos:
    name: build / ${{ matrix.platform }} / ffmpeg-${{ matrix.ffmpeg_version }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ["macos/amd64"]
        ffmpeg_version: ["6", "7", "8"]
        include:
          - ffmpeg_version: "6"
            feature: "ndarray,ffmpeg6,link_system_ffmpeg"
          - ffmpeg_version: "7"
            feature: "ndarray,ffmpeg7,link_system_ffmpeg"
          - ffmpeg_version: "8"
            feature: "ndarray,ffmpeg8,link_system_ffmpeg"

    env:
      FFMPEG_PKG_CONFIG_PATH: /opt/homebrew/opt/ffmpeg@${{ matrix.ffmpeg_version }}/lib/pkgconfig
      FFMPEG_INCLUDE_DIR: /opt/homebrew/opt/ffmpeg@${{ matrix.ffmpeg_version }}/include

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: brew install pkg-config ffmpeg@${{ matrix.ffmpeg_version }}

      - name: Clippy check
        run: cargo clippy --no-default-features --features ${{ matrix.feature }} -- -D warnings

      - name: Build
        run: cargo build --no-default-features --features ${{ matrix.feature }} --verbose

      - name: Run Test
        run: cargo test --all --no-default-features --features ${{ matrix.feature }} --verbose -- --nocapture

  build-windows:
    name: build / windows-${{ matrix.config.vcpkg_triplet }} / ffmpeg-7.1
    runs-on: windows-latest

    env:
      FFMPEG_VERSION: "7.1"
      BUILD_FEATURES: "ndarray,ffmpeg7,link_vcpkg_ffmpeg"

    strategy:
      matrix:
        config:
          - target: "x86_64-pc-windows-msvc"
            vcpkg_triplet: "x64-windows-static"
            rustflags: "-Ctarget-feature=+crt-static"
          - target: "x86_64-pc-windows-msvc"
            vcpkg_triplet: "x64-windows-static-md"
          - target: "x86_64-pc-windows-msvc"
            vcpkg_triplet: "x64-windows"
            dynamic: true
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt, clippy
          targets: ${{ matrix.config.target }}

      # Using this since it's used by clang-sys's CI
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "10.0"
          directory: ${{ github.workspace }}/clang

      - name: Cache vcpkg
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg
          key: vcpkg-${{ runner.os }}-${{ matrix.config.vcpkg_triplet }}

      - name: Build vcpkg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg --depth 1
          ./vcpkg/bootstrap-vcpkg.bat

      - name: Install Dependencies
        run: |
          ./vcpkg/vcpkg.exe install ffmpeg:${{ matrix.config.vcpkg_triplet }}

      - name: Set env
        shell: bash
        run: |
          if [ '${{ matrix.config.dynamic }}' != '' ]; then
            echo "VCPKGRS_DYNAMIC=1" >> $GITHUB_ENV
          fi

      - name: Clippy check
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.config.rustflags }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.config.vcpkg_triplet }}
          LIBCLANG_PATH: ${{ github.workspace }}/clang/lib
          LLVM_CONFIG_PATH: ${{ github.workspace }}/clang/bin/llvm-config
        run: cargo clippy --no-default-features --features ${{ env.BUILD_FEATURES }} --target ${{ matrix.config.target }} -- -D warnings

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.config.rustflags }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.config.vcpkg_triplet }}
          LIBCLANG_PATH: ${{ github.workspace }}/clang/lib
          LLVM_CONFIG_PATH: ${{ github.workspace }}/clang/bin/llvm-config
        run: cargo build --no-default-features --features ${{ env.BUILD_FEATURES }} --target ${{ matrix.config.target }} --verbose

      - name: Run Test
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.config.rustflags }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.config.vcpkg_triplet }}
          LIBCLANG_PATH: ${{ github.workspace }}/clang/lib
          LLVM_CONFIG_PATH: ${{ github.workspace }}/clang/bin/llvm-config
        run: cargo test --no-default-features --features ${{ env.BUILD_FEATURES }} --target ${{ matrix.config.target }} --verbose -- --nocapture

  test_and_clippy:
    name: Clippy & Test / ${{ matrix.platform }} / ffmpeg-${{ matrix.ffmpeg_version }}
    runs-on: ubuntu-latest
    container:
      image: jrottenberg/ffmpeg:${{ matrix.ffmpeg_version }}-ubuntu

    env:
      DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
      FFMPEG_INCLUDE_DIR: /usr/local/include
      FFMPEG_PKG_CONFIG_PATH: /usr/local/lib/pkgconfig

    strategy:
      fail-fast: false
      matrix:
        platform: ["linux/amd64"]
        ffmpeg_version: ["6.1", "7.1", "8.0"]
        include:
          - ffmpeg_version: "6.1"
            feature: "ndarray,ffmpeg6,link_system_ffmpeg"
          - ffmpeg_version: "7.1"
            feature: "ndarray,ffmpeg7,link_system_ffmpeg"
          - ffmpeg_version: "8.0"
            feature: "ndarray,ffmpeg8,link_system_ffmpeg"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          nasm \
          yasm \
          curl \
          wget \
          unzip \
          gnupg \
          clang \
          cmake \
          libtool \
          autoconf \
          automake \
          binutils \
          pkg-config \
          llvm-dev \
          libclang-dev \
          linux-libc-dev \
          build-essential \
          ca-certificates \
          libva-dev \
          libvpx-dev \
          libaom-dev \
          libass-dev \
          libdrm-dev \
          libv4l-dev \
          libx264-dev \
          libx265-dev \
          libzimg-dev \
          libdav1d-dev \
          libwebp-dev \
          libbluray-dev \
          libtheora-dev \
          libvidstab-dev \
          libsvtav1-dev \
          libxvidcore-dev \
          libopenjp2-7-dev \
          libgsm1-dev \
          libsoxr-dev \
          libopus-dev \
          libpulse-dev \
          libshine-dev \
          libspeex-dev \
          libbs2b-dev \
          libvorbis-dev \
          libfdk-aac-dev \
          libasound2-dev \
          libmp3lame-dev \
          libtwolame-dev \
          libjack-jackd2-dev \
          libopencore-amrnb-dev \
          libopencore-amrwb-dev \
          libva-dev \
          libmfx-dev \
          libdrm-dev \
          libnuma-dev \
          libvdpau-dev \
          ocl-icd-opencl-dev \
          libass-dev \
          libxml2-dev \
          libfribidi-dev \
          libfreetype6-dev \
          libfontconfig1-dev \
          libssh-dev \
          libzmq3-dev \
          libssl-dev \
          librtmp-dev \
          libiec61883-dev \
          libgnutls28-dev \
          libsmbclient-dev \
          libtiff-dev \
          libpng-dev \
          libraw-dev \
          libjpeg-dev \
          zlib1g-dev \
          libsdl2-dev \
          liblzma-dev \
          libzvbi-dev \
          libpostproc-dev \
          librubberband-dev \
          libfrei0r-ocaml-dev
## ffmpeg
## libavutil-dev \
## libavcodec-dev \
## libavformat-dev \
## libavfilter-dev \
## libavdevice-dev \
## libswscale-dev \
## libswresample-dev \

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Clippy
        run: cargo clippy --all --no-default-features --features ${{ matrix.feature }} -- -D warnings

      - name: Test
        run: cargo test --all --no-default-features --features ${{ matrix.feature }} --verbose -- --nocapture

  lints:
    name: Rust fmt / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt

      - name: Rust fmt
        run: cargo fmt --all -- --check
