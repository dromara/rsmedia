[package]
name = "rsmedia"
version = "0.1.0"
edition = "2021"
readme = "README.md"
license = "MIT OR Apache-2.0"
description = "High-level video toolkit based on ffmpeg."
keywords = ["video", "ffmpeg", "encoding", "decoding", "muxing"]
categories = ["multimedia", "multimedia::video", "multimedia::audio"]
authors = ["phial3"]
repository = "https://github.com/dromara/rsmedia.git"
exclude = [".github/*", "assets/*", "data/*", "examples/*", "tests/*", "benches/*", "docs/*", ]

[features]
default = ["ndarray", "ffmpeg8", "link_system_ffmpeg"]
ffmpeg6 = ["rsmpeg/ffmpeg6"]
ffmpeg7 = ["rsmpeg/ffmpeg7_1"]
ffmpeg8 = ["rsmpeg/ffmpeg8"]
## unxi linking ffmpeg with pkg-config.
link_system_ffmpeg = ["rsmpeg/link_system_ffmpeg"]
## windows linking ffmpeg with vcpkg.
link_vcpkg_ffmpeg = ["rsmpeg/link_vcpkg_ffmpeg"]

[dependencies]
pix = "1.0"
rgb = "0.8"
color = "0.3"
yuv = { version = "0.8", features = ["rayon", "professional_mode"] }
colorous = "1.0"
colorutils-rs = "0.8"
palette = "0.7"
image = "0.25"
imageproc = "0.27"
num-traits = "0.2"
anyhow = "1.0"
log = "0.4"
tracing = "0.1"
url = "2.5"
rand = "0.10"
rayon = "1.11"
dashmap = "6.1"
once_cell = "1.21"
num_cpus = "1.17"
ndarray = { version = "0.17", optional = true }
# use custom rsmpeg
rsmpeg = { git = "https://gitee.com/phial3/rsmpeg", branch = "dev", default-features = false }

[dev-dependencies]
libc = "0.2"
camino = "1.2"
chrono = "0.4"
ringbuf = "0.5"
ctor = "1.0"
dtor = "1.0"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "chrono"] }
ab_glyph = "0.2"
libblur = "0.24"
pic-scale = "0.7"
fast_image_resize = "6.0"
histogram_equalization = "0.2"
## security & async
futures = "0.3"
tokio = { version = "1", features = ["full"] }
## sound & audio
cpal = "0.18"
wavers = "1.5"
rubato = "4.0"
dasp = { version = "0.11", features = ["all"] }
rodio = { version = "0.22", features = ["symphonia-all", "tracing"] }

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "decoding"
path = "examples/decoding.rs"
required-features = ["ndarray"]

[[example]]
name = "encoding"
path = "examples/encoding.rs"
required-features = ["ndarray"]

[[example]]
name = "decode_raw"
path = "examples/decode_raw.rs"

[[example]]
name = "audio"
path = "examples/audio.rs"
required-features = ["ndarray"]

[[example]]
name = "seek"
path = "examples/seek.rs"
required-features = ["ndarray"]

[[example]]
name = "metadata"
path = "examples/metadata.rs"
required-features = ["ndarray"]

[[example]]
name = "filter_demo"
path = "examples/filter_demo.rs"
required-features = ["ndarray"]

[[example]]
name = "color_professional"
path = "examples/color_professional.rs"
required-features = ["ndarray"]

[[example]]
name = "quick_write"
path = "examples/quick_write.rs"
required-features = ["ndarray"]
