name: ci

on:
  push:
    branches: [ "main", "rsmpeg", "dev" ]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ "main", "rsmpeg", "dev" ]
    paths-ignore:
      - 'README.md'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_LOG: "debug"
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:

  build-linux:
    name: build / ${{ matrix.platform }} / ffmpeg-${{ matrix.ffmpeg_version }}
    runs-on: ubuntu-latest
    container:
      image: jrottenberg/ffmpeg:${{ matrix.ffmpeg_version }}-ubuntu

    env:
      DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
      FFMPEG_INCLUDE_DIR: /usr/local/include
      FFMPEG_PKG_CONFIG_PATH: /usr/local/lib/pkgconfig

    strategy:
      fail-fast: false
      matrix:
        platform: ["linux/amd64"]
        ffmpeg_version: ["6.1", "7.1", "8.0"]
        include:
          - ffmpeg_version: "6.1"
            feature: "ndarray,ffmpeg6,link_system_ffmpeg"
          - ffmpeg_version: "7.1"
            feature: "ndarray,ffmpeg7,link_system_ffmpeg"
          - ffmpeg_version: "8.0"
            feature: "ndarray,ffmpeg8,link_system_ffmpeg"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          nasm \
          yasm \
          curl \
          wget \
          unzip \
          gnupg \
          clang \
          cmake \
          libtool \
          autoconf \
          automake \
          binutils \
          pkg-config \
          llvm-dev \
          libc++1 \
          libva2 \
          libva-drm2 \
          libva-x11-2 \
          libvdpau1 \
          libxv1 \
          libclang-dev \
          linux-libc-dev \
          build-essential \
          ca-certificates \
          libva-dev \
          libvpx-dev \
          libaom-dev \
          libass-dev \
          libdrm-dev \
          libv4l-dev \
          libx264-dev \
          libx264-164 \
          libx265-dev \
          libx265-199 \
          libzimg-dev \
          libdav1d-dev \
          libwebp-dev \
          libbluray-dev \
          libtheora-dev \
          libvidstab-dev \
          libsvtav1-dev \
          libxvidcore-dev \
          libopenjp2-7-dev \
          libgsm1-dev \
          libsoxr-dev \
          libopus-dev \
          libpulse-dev \
          libshine-dev \
          libspeex-dev \
          libbs2b-dev \
          libvorbis-dev \
          libfdk-aac-dev \
          libasound2-dev \
          libmp3lame-dev \
          libmp3lame0 \
          libtwolame-dev \
          libjack-jackd2-dev \
          libopencore-amrnb-dev \
          libopencore-amrwb-dev \
          libva-dev \
          libmfx-dev \
          libdrm-dev \
          libnuma-dev \
          libvdpau-dev \
          ocl-icd-opencl-dev \
          libass-dev \
          libxml2-dev \
          libfribidi-dev \
          libfreetype6-dev \
          libfontconfig1-dev \
          libssh-dev \
          libzmq3-dev \
          libssl-dev \
          librtmp-dev \
          libiec61883-dev \
          libgnutls28-dev \
          libsmbclient-dev \
          libtiff-dev \
          libpng-dev \
          libraw-dev \
          libjpeg-dev \
          zlib1g-dev \
          libsdl2-dev \
          liblzma-dev \
          libzvbi-dev \
          libpostproc-dev \
          librubberband-dev \
          libfrei0r-ocaml-dev
## ffmpeg
## libavutil-dev \
## libavcodec-dev \
## libavformat-dev \
## libavfilter-dev \
## libavdevice-dev \
## libswscale-dev \
## libswresample-dev \

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt, clippy, rust-src, llvm-tools-preview, rust-analysis

      - name: Clippy check
        run: cargo clippy --all --no-default-features --features ${{ matrix.feature }} -- -D warnings

      - name: Build
        run: cargo build --no-default-features --features ${{ matrix.feature }} --verbose

      - name: Run Test
        run: cargo test --all --no-default-features --features ${{ matrix.feature }} --verbose -- --nocapture

  build-macos:
    name: build / ${{ matrix.platform }} / ffmpeg-${{ matrix.ffmpeg_version }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ["macos/amd64"]
        ffmpeg_version: ["6", "7", "8"]
        include:
          - ffmpeg_version: "6"
            feature: "ndarray,ffmpeg6,link_system_ffmpeg"
          - ffmpeg_version: "7"
            feature: "ndarray,ffmpeg7,link_system_ffmpeg"
          - ffmpeg_version: "8"
            feature: "ndarray,ffmpeg8,link_system_ffmpeg"

    env:
      FFMPEG_PKG_CONFIG_PATH: /opt/homebrew/opt/ffmpeg@${{ matrix.ffmpeg_version }}/lib/pkgconfig
      FFMPEG_INCLUDE_DIR: /opt/homebrew/opt/ffmpeg@${{ matrix.ffmpeg_version }}/include
      CPPFLAGS: "-I/opt/homebrew/opt/ffmpeg@${{ matrix.ffmpeg_version }}/include"
      LDFLAGS: "-L/opt/homebrew/opt/ffmpeg@${{ matrix.ffmpeg_version }}/lib"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: brew install pkg-config ffmpeg@${{ matrix.ffmpeg_version }}

      - name: Clippy check
        run: cargo clippy --no-default-features --features ${{ matrix.feature }} -- -D warnings

      - name: Build
        run: cargo build --no-default-features --features ${{ matrix.feature }} --verbose

      - name: Run Test
        run: cargo test --all --no-default-features --features ${{ matrix.feature }} --verbose -- --nocapture

  build-windows:
    name: build / windows / ffmpeg-8.1
    runs-on: windows-latest

    env:
      FFMPEG_VERSION: "8.1"
      BUILD_FEATURES: "ndarray,ffmpeg8,link_vcpkg_ffmpeg"
      FFMPEG_DOWNLOAD_URL: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          $VCINSTALLDIR = $(& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath)
          Add-Content $env:GITHUB_ENV "LIBCLANG_PATH=${VCINSTALLDIR}\VC\Tools\LLVM\x64\bin"
          Invoke-WebRequest "${env:FFMPEG_DOWNLOAD_URL}" -OutFile ffmpeg-release-full-shared.7z
          7z x ffmpeg-release-full-shared.7z
          mkdir ffmpeg
          mv ffmpeg-*/* ffmpeg/
          Add-Content $env:GITHUB_PATH "${pwd}\ffmpeg\bin"
          Add-Content $env:GITHUB_ENV "FFMPEG_DIR=${pwd}\ffmpeg"
          Add-Content $env:GITHUB_ENV "FFMPEG_LIBS_DIR=${pwd}\ffmpeg\lib"
          Add-Content $env:GITHUB_ENV "FFMPEG_INCLUDE_DIR=${pwd}\ffmpeg\include"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Clippy check
        run: cargo clippy --no-default-features --features ${{ env.BUILD_FEATURES }} -- -D warnings

      - name: Build
        run: cargo build --no-default-features --features ${{ env.BUILD_FEATURES }} --verbose

      - name: Run Test
        run: cargo test --no-default-features --features ${{ env.BUILD_FEATURES }} --verbose -- --nocapture

  test_and_clippy:
    name: Clippy & Test / ${{ matrix.platform }} / ffmpeg-${{ matrix.ffmpeg_version }}
    runs-on: ubuntu-latest
    container:
      image: jrottenberg/ffmpeg:${{ matrix.ffmpeg_version }}-ubuntu

    env:
      DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
      FFMPEG_INCLUDE_DIR: /usr/local/include
      FFMPEG_PKG_CONFIG_PATH: /usr/local/lib/pkgconfig

    strategy:
      fail-fast: false
      matrix:
        platform: ["linux/amd64"]
        ffmpeg_version: ["6.1", "7.1", "8.0"]
        include:
          - ffmpeg_version: "6.1"
            feature: "ndarray,ffmpeg6,link_system_ffmpeg"
          - ffmpeg_version: "7.1"
            feature: "ndarray,ffmpeg7,link_system_ffmpeg"
          - ffmpeg_version: "8.0"
            feature: "ndarray,ffmpeg8,link_system_ffmpeg"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          jq \
          nasm \
          yasm \
          curl \
          wget \
          unzip \
          gnupg \
          clang \
          cmake \
          libtool \
          autoconf \
          automake \
          binutils \
          pkg-config \
          llvm-dev \
          libclang-dev \
          linux-libc-dev \
          build-essential \
          ca-certificates \
          libva-dev \
          libvpx-dev \
          libaom-dev \
          libass-dev \
          libdrm-dev \
          libv4l-dev \
          libx264-dev \
          libx265-dev \
          libzimg-dev \
          libdav1d-dev \
          libwebp-dev \
          libbluray-dev \
          libtheora-dev \
          libvidstab-dev \
          libsvtav1-dev \
          libxvidcore-dev \
          libopenjp2-7-dev \
          libgsm1-dev \
          libsoxr-dev \
          libopus-dev \
          libpulse-dev \
          libshine-dev \
          libspeex-dev \
          libbs2b-dev \
          libvorbis-dev \
          libfdk-aac-dev \
          libasound2-dev \
          libmp3lame-dev \
          libtwolame-dev \
          libjack-jackd2-dev \
          libopencore-amrnb-dev \
          libopencore-amrwb-dev \
          libva-dev \
          libmfx-dev \
          libdrm-dev \
          libnuma-dev \
          libvdpau-dev \
          ocl-icd-opencl-dev \
          libass-dev \
          libxml2-dev \
          libfribidi-dev \
          libfreetype6-dev \
          libfontconfig1-dev \
          libssh-dev \
          libzmq3-dev \
          libssl-dev \
          librtmp-dev \
          libiec61883-dev \
          libgnutls28-dev \
          libsmbclient-dev \
          libtiff-dev \
          libpng-dev \
          libraw-dev \
          libjpeg-dev \
