name: ci

on:
  push:
    branches: [ "main", "rsmpeg", "dev" ]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ "main", "rsmpeg", "dev" ]
    paths-ignore:
      - 'README.md'

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: "debug"
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:

  build-linux:
    name: build / linux-x86_64 / ffmpeg ${{ matrix.ffmpeg_version }}
    runs-on: ubuntu-latest
    container: jrottenberg/ffmpeg:${{ matrix.ffmpeg_version }}-ubuntu

    strategy:
      matrix:
        include:
          # FFmpeg 6.x
          - ffmpeg_version: "6.1"
            feature: "ndarray,ffmpeg6,link_system_ffmpeg"
          # FFmpeg 7.x
          - ffmpeg_version: "7.1"
            feature: "ndarray,ffmpeg7,link_system_ffmpeg"
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            lld \
            nasm \
            yasm \
            curl \
            wget \
            gnupg \
            libc6 \
            libc6-dev \
            libgcc-s1 \
            linux-libc-dev \
            binutils \
            pkg-config \
            libx264-dev \
            libx265-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavdevice-dev \
            libavfilter-dev \
            libssl-dev \
            librtmp-dev \
            libvpx-dev \
            libaom-dev \
            libsvtav1-dev \
            libxvidcore-dev \
            libmp3lame-dev \
            libopus-dev \
            libvorbis-dev \
            libfdk-aac-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy, rust-src, llvm-tools-preview, rust-analysis

      - name: Configure Rust linker
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << EOF
          [target.x86_64-unknown-linux-gnu]
          rustflags = [
            "-C", "link-arg=-Wl,--no-as-needed",
            "-C", "link-arg=-ldl",
            "-C", "link-arg=-pthread",
            "-C", "link-arg=-lc",
            "-C", "link-arg=-Wl,--copy-dt-needed-entries",
            "-C", "link-arg=-dynamic-linker=/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2"
          ]
          EOF

      - name: Clippy check
        run: cargo clippy --no-default-features --features ${{ matrix.feature }} -- -D warnings

      - name: Build
        run: cargo build --no-default-features --features ${{ matrix.feature }} --verbose

      - name: Run Test
        run: cargo test --no-default-features --features ${{ matrix.feature }} --verbose -- --nocapture

  build-macos:
    name: build / macos / latest ffmpeg
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: |
          brew install ffmpeg pkg-config

      - name: Clippy check
        run: cargo clippy --all --all-features -- -D warnings

      - name: Build
        run: cargo build --all --all-features --verbose

      - name: Run Test
        run: cargo test --all --all-features --verbose -- --nocapture

  build-windows:
    name: build / windows-x86_64 / ffmpeg ${{ matrix.config.ffmpeg_version }}
    runs-on: windows-latest

    strategy:
      matrix:
        config:
          - ffmpeg_version: "7.1"
            feature: "ndarray,ffmpeg7,link_vcpkg_ffmpeg"
            target: "x86_64-pc-windows-msvc"
            vcpkg_triplet: "x64-windows-static"
            rustflags: "-Ctarget-feature=+crt-static"
          - ffmpeg_version: "7.1"
            feature: "ndarray,ffmpeg7,link_vcpkg_ffmpeg"
            target: "x86_64-pc-windows-msvc"
            vcpkg_triplet: "x64-windows-static-md"
          - ffmpeg_version: "7.1"
            feature: "ndarray,ffmpeg7,link_vcpkg_ffmpeg"
            target: "x86_64-pc-windows-msvc"
            vcpkg_triplet: "x64-windows"
            dynamic: true
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          toolchain: stable
          targets: ${{ matrix.config.target }}

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Using this since it's used by clang-sys's CI
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: "10.0"
          directory: ${{ github.workspace }}/clang

      - name: Cache vcpkg
        id: cache
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/vcpkg
          key: vcpkg-${{ runner.os }}-${{ matrix.config.vcpkg_triplet }}

      - name: Build vcpkg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg --depth 1
          ./vcpkg/bootstrap-vcpkg.bat

      - name: Install Dependencies
        run: |
          ./vcpkg/vcpkg.exe install ffmpeg:${{ matrix.config.vcpkg_triplet }}

      - name: Set env
        shell: bash
        run: |
          if [ '${{ matrix.config.dynamic }}' != '' ]; then
            echo "VCPKGRS_DYNAMIC=1" >> $GITHUB_ENV
          fi

      - name: Clippy check
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.config.rustflags }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.config.vcpkg_triplet }}
          LIBCLANG_PATH: ${{ github.workspace }}/clang/lib
          LLVM_CONFIG_PATH: ${{ github.workspace }}/clang/bin/llvm-config
        run: cargo clippy --no-default-features --features ${{ matrix.config.feature }} -- -D warnings

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.config.rustflags }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.config.vcpkg_triplet }}
          LIBCLANG_PATH: ${{ github.workspace }}/clang/lib
          LLVM_CONFIG_PATH: ${{ github.workspace }}/clang/bin/llvm-config
        run: cargo build --no-default-features --features ${{ matrix.config.feature }} --target ${{ matrix.config.target }} --verbose

      - name: Run Test
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.config.rustflags }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.config.vcpkg_triplet }}
          LIBCLANG_PATH: ${{ github.workspace }}/clang/lib
          LLVM_CONFIG_PATH: ${{ github.workspace }}/clang/bin/llvm-config
        run: cargo test --no-default-features --features ${{ matrix.config.feature }} --target ${{ matrix.config.target }} --verbose -- --nocapture

  test:
    runs-on: ubuntu-latest
    container: jrottenberg/ffmpeg:7.1-ubuntu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            lld \
            nasm \
            yasm \
            curl \
            wget \
            gnupg \
            libc6 \
            libc6-dev \
            libgcc-s1 \
            linux-libc-dev \
            binutils \
            pkg-config \
            libx264-dev \
            libx265-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavdevice-dev \
            libavfilter-dev \
            libssl-dev \
            librtmp-dev \
            libvpx-dev \
            libaom-dev \
            libsvtav1-dev \
            libxvidcore-dev \
            libmp3lame-dev \
            libopus-dev \
            libvorbis-dev \
            libfdk-aac-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Rust linker settings
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << EOF
          [target.x86_64-unknown-linux-gnu]
          rustflags = [
            "-C", "link-arg=-Wl,--no-as-needed",
            "-C", "link-arg=-ldl",
            "-C", "link-arg=-pthread",
            "-C", "link-arg=-lc",
            "-C", "link-arg=-Wl,--copy-dt-needed-entries",
            "-C", "link-arg=-dynamic-linker=/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2"
          ]
          EOF

      - name: Test
        run: cargo test --all --all-features --verbose -- --nocapture

  lints:
    runs-on: ubuntu-latest
    container: jrottenberg/ffmpeg:7.1-ubuntu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            lld \
            nasm \
            yasm \
            curl \
            wget \
            gnupg \
            libc6 \
            libc6-dev \
            libgcc-s1 \
            linux-libc-dev \
            binutils \
            pkg-config \
            libx264-dev \
            libx265-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavdevice-dev \
            libavfilter-dev \
            libssl-dev \
            librtmp-dev \
            libvpx-dev \
            libaom-dev \
            libsvtav1-dev \
            libxvidcore-dev \
            libmp3lame-dev \
            libopus-dev \
            libvorbis-dev \
            libfdk-aac-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust fmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all --all-features  -- -D warnings
