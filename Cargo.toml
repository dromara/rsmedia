[package]
name = "rsmedia"
version = "0.4.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
description = "High-level video toolkit based on ffmpeg."
keywords = ["video", "ffmpeg", "encoding", "decoding", "muxing"]
categories = ["multimedia", "multimedia::video", "multimedia::audio"]
authors = ["phial3"]
repository = "https://github.com/dromara/rsmedia.git"
exclude = [".github/*", "assets/*", "data/*", "examples/*", "tests/*", "benches/*", "docs/*", ]

[features]
default = ["ndarray", "ffmpeg9", "link_system_ffmpeg"]
ffmpeg6 = ["rsmpeg/ffmpeg6_1"]
ffmpeg7 = ["rsmpeg/ffmpeg7_1"]
ffmpeg8 = ["rsmpeg/ffmpeg8_1"]
ffmpeg9 = ["rsmpeg/ffmpeg9"]
## unxi linking ffmpeg with pkg-config.
link_system_ffmpeg = ["rsmpeg/link_system_ffmpeg"]
## windows linking ffmpeg with vcpkg.
link_vcpkg_ffmpeg = ["rsmpeg/link_vcpkg_ffmpeg"]

[dependencies]
libc = "0.2"
log = "0.4"
tracing = "0.1"
url = "2.5"
dashmap = "6.1"
once_cell = "1.21"
num_cpus = "1.17"
image = "0.25"
colorous = "1.0"
num-traits = "0.2"
palette = "0.7"
colorutils-rs = "0.8"
yuv = { version = "0.8", features = ["rayon", "professional_mode"] }
ndarray = { version = "0.17", optional = true }
rsmpeg = { git = "https://github.com/phial3/rsmpeg", branch = "ffmpeg9", default-features = false }

[dev-dependencies]
anyhow = "1.0"
criterion = "0.8"
camino = "1.2"
chrono = "0.4"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "chrono"] }
#pix = "1.0"
#rgb = "0.8"
#color = "0.3"
ab_glyph = "0.2"
imageproc = "0.27"
#libblur = "0.24"
#pic-scale = "0.7"
#fast_image_resize = "6.0"
#histogram_equalization = "0.2"
## security & async
futures = "0.3"
tokio = { version = "1", features = ["full"] }
## sound & audio
cpal = "0.18"
wavers = "1.5"
#rubato = "5.0"
#dasp = { version = "0.11", features = ["all"] }
rodio = { version = "0.22", features = ["symphonia-all", "tracing"] }

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "decoding"
path = "examples/decoding.rs"
required-features = ["ndarray"]
test = false

[[bench]]
name = "encode_pipeline"
path = "benches/encode_pipeline.rs"
required-features = ["ndarray"]
harness = false

[[bench]]
name = "encode_single_thread"
path = "benches/encode_single_thread.rs"
required-features = ["ndarray"]
harness = false

[[bench]]
name = "encode_mux_container"
